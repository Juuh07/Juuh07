name: Generate GitHub Contribution Snake

on:
  # roda automaticamente todo dia à meia-noite
  schedule:
    - cron: "0 0 * * *"
  
  # permite rodar manualmente
  workflow_dispatch:
  
  # roda em push no branch principal
  push:
    branches:
      - main  # substitua por master se seu repo usar master

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # 1️⃣ Baixa a Action que gera o snake
      - name: Generate contribution snake (light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Generate contribution snake (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          palette: github-dark
          outputs: |
            dist/github-contribution-grid-snake-dark.svg

      # 2️⃣ Envia os SVGs para o branch output
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
